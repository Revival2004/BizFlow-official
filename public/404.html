<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>BizFlow</title>
    <meta
      name="description"
      content="BizFlow keeps sales, stock, reports, billing, staff, and checkout operations flowing across phone and desktop."
    />
    <meta name="theme-color" content="#040B18" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #040b18;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
  </head>
  <body>
    <p>Opening BizFlow...</p>
    <script>
      (function () {
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var redirect = '/?__bf_path=' + encodeURIComponent(window.location.pathname);

        if (search) {
          redirect += '&__bf_query=' + encodeURIComponent(search);
        }

        if (hash) {
          redirect += '&__bf_hash=' + encodeURIComponent(hash);
        }

        window.location.replace(redirect);
      })();
    </script>
  </body>
</html>
